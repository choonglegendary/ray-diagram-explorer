<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave Lab | Legendary Six</title><link rel="stylesheet" href="explorer-shared.css"><style>
.wave-modes{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}.wave-modes>span{align-self:center;margin-right:3px;color:var(--muted);font-size:12px;font-weight:750}.wave-modes button{min-height:40px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:white;font-weight:750}.wave-modes button.active{color:white;border-color:var(--brand);background:var(--brand)}.wave-controls{grid-template-columns:repeat(5,1fr) auto}.transport{display:flex;align-items:center;gap:10px;padding:13px 18px 16px;border-top:1px solid var(--line);background:#fffaf7}.transport input{flex:1}.transport button{min-width:82px;min-height:40px;border:1px solid #d6bdc6;border-radius:9px;color:var(--brand-dark);background:white;font-weight:800}.wave-one{fill:none;stroke:#e34343;stroke-width:3}.wave-two{fill:none;stroke:#2864dc;stroke-width:3}.wave-result{fill:none;stroke:#7b3fc6;stroke-width:4}.wave-axis{stroke:#9ba2af;stroke-width:1.4}.particle-one{fill:#e34343}.particle-two{fill:#2864dc}.particle-result{fill:#7b3fc6}.node{fill:#00a37a;stroke:white;stroke-width:2}.antinode{fill:#ffb62e;stroke:white;stroke-width:2}.pipe{fill:#f8f5fc;stroke:var(--brand-dark);stroke-width:4}.pipe-open{stroke:var(--brand-dark);stroke-width:4;fill:none}.wall{fill:#d9cbd2;stroke:var(--brand-dark);stroke-width:3}.air-particle{fill:#2864dc;opacity:.76}.direction{stroke-width:3;fill:none}.wave-note{fill:var(--muted);font-size:14px;font-weight:700}.formula{fill:var(--brand-dark);font-size:18px;font-weight:800;paint-order:stroke;stroke:white;stroke-width:5px}.diagram-wrap svg{cursor:ns-resize}
@media(max-width:860px){.wave-controls{grid-template-columns:1fr 1fr}.wave-controls .field{grid-column:auto}.wave-controls .reset{grid-column:1/-1}}@media(max-width:620px){.wave-modes{padding:10px 14px}.wave-modes button{flex:1 1 calc(33.33% - 8px);padding:7px 8px;font-size:12px}.transport{padding:12px 14px}.diagram-wrap svg .wave-one,.diagram-wrap svg .wave-two{stroke-width:4}.diagram-wrap svg .wave-result{stroke-width:5}}
</style></head><body><main class="app"><header><div class="brand-lockup"><img class="brand-logo" src="assets/legendary-six-logo.jpg" alt="Legendary Six logo"><div><span class="brand-name">Legendary Six</span><h1>Wave Lab</h1><div class="brand-contact"><span>Mr. Choong</span><span class="phone">016-484 0556</span></div></div></div></header>
<nav class="site-nav" aria-label="Simulation pages"><a href="index.html">Mirror &amp; Lens</a><a href="spherical-refraction.html">Spherical Refraction</a><a href="plane-surface.html">Plane Surface</a><a href="refracting-sphere.html">Refracting Sphere</a><a class="active" href="wave-lab.html">Wave Lab</a></nav>
<section class="controls wave-controls card"><div class="field"><label for="amplitude1">Amplitude</label><div class="range-row"><input id="amplitude1" type="range" min="10" max="60" step="1" value="42"><output id="amplitude1Output">42 cm</output></div></div><div class="field" id="amplitude2Field"><label for="amplitude2">Wave 2 amplitude</label><div class="range-row"><input id="amplitude2" type="range" min="10" max="60" step="1" value="42"><output id="amplitude2Output">42 cm</output></div></div><div class="field" id="wavelengthField"><label for="wavelength">Wavelength, λ</label><div class="range-row"><input id="wavelength" type="range" min="60" max="400" step="5" value="180"><output id="wavelengthOutput">180 cm</output></div></div><div class="field" id="frequencyField"><label for="frequency">Frequency, f</label><div class="range-row"><input id="frequency" type="range" min=".25" max="3" step=".05" value="1"><output id="frequencyOutput">1.00 Hz</output></div></div><div class="field" id="phaseField"><label for="phaseDifference">Phase difference</label><div class="range-row"><input id="phaseDifference" type="range" min="0" max="360" step="5" value="0"><output id="phaseOutput">0°</output></div></div><div class="field" id="directionField"><span class="field-label">Wave 2 direction</span><div class="segmented" id="directionControl"><button data-value="right">Right</button><button class="active" data-value="left">Left</button></div></div><div class="field" id="harmonicField" hidden><label for="harmonic">Mode number</label><div class="range-row"><input id="harmonic" type="range" min="1" max="6" step="1" value="2"><output id="harmonicOutput">2</output></div></div><div class="field" id="pipeLengthField" hidden><label for="pipeLength">Pipe length, L</label><div class="range-row"><input id="pipeLength" type="range" min="40" max="200" step="5" value="120"><output id="pipeLengthOutput">120 cm</output></div></div><div class="field" id="pipeTypeField" hidden><span class="field-label">Air column</span><div class="segmented" id="pipeTypeControl"><button class="active" data-value="open">Open–open</button><button data-value="closed">Closed–open</button></div></div><button class="reset" id="reset">Reset</button></section>
<section class="card"><div class="wave-modes" id="modeControl"><span>Wave model</span><button class="active" data-mode="superposition">Superposition</button><button data-mode="string">Standing string</button><button data-mode="pipe">Air column</button></div><div class="diagram-wrap"><svg id="diagram" viewBox="0 0 1100 560" role="img" aria-label="Animated wave simulation"></svg></div><div class="transport"><button id="playPause">Pause</button><input id="timePhase" aria-label="Animation phase" type="range" min="0" max="1" step=".001" value="0"><output id="timeOutput">0°</output></div><div class="readout"><div class="datum"><span>Mode</span><strong id="modeValue">Superposition</strong></div><div class="datum"><span>Wavelength, λ</span><strong id="lambdaValue">180 cm</strong></div><div class="datum"><span>Frequency, f</span><strong id="freqValue">1.00 Hz</strong></div><div class="datum description"><span>Wave information</span><strong id="description">—</strong></div></div></section></main>
<script>
const W=1100,H=560,x0=80,x1=1020,svg=document.getElementById('diagram'),$=id=>document.getElementById(id);const state={mode:'superposition',A1:42,A2:42,lambda:180,f:1,phase:0,direction:'left',harmonic:2,pipeLength:120,pipeType:'open',t:0,running:true};let last=0,dragging='';
function el(n,a={},text=''){const q=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>q.setAttribute(k,v));if(text)q.textContent=text;svg.appendChild(q);return q}function path(points,c){el('path',{d:points.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' '),class:c})}function line(a,b,c,d,cls,marker=''){el('line',{x1:a,y1:b,x2:c,y2:d,class:cls,...(marker?{'marker-end':`url(#${marker})`}:{})})}function text(x,y,s,cls='svg-label',anchor='start'){el('text',{x,y,class:cls,'text-anchor':anchor},s)}function defs(){const d=el('defs'),m=document.createElementNS('http://www.w3.org/2000/svg','marker');Object.entries({id:'directionArrow',viewBox:'0 0 10 8',refX:9,refY:4,markerWidth:10,markerHeight:8,orient:'auto'}).forEach(([k,v])=>m.setAttribute(k,v));const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M0 0L10 4L0 8Z');p.setAttribute('fill','#7f1737');m.appendChild(p);d.appendChild(m)}function samples(fn){const a=[];for(let i=0;i<=240;i++){const x=x0+(x1-x0)*i/240;a.push([x,fn(x,i/240)])}return a}function dots(fn,cls){for(let i=0;i<=12;i++){const x=x0+(x1-x0)*i/12;el('circle',{cx:x,cy:fn(x,i/12),r:4,class:cls})}}
function drawSuperposition(){const yA=135,yB=290,yR=435,k=2*Math.PI/(state.lambda*2),wt=2*Math.PI*state.f*state.t,ph=state.phase*Math.PI/180,w1=(x)=>state.A1*Math.sin(k*(x-x0)-wt),w2=(x)=>state.A2*Math.sin(k*(x-x0)+(state.direction==='left'?wt:-wt)+ph);for(const[y,label]of[[yA,'Wave 1'],[yB,'Wave 2'],[yR,'Resultant']]){line(x0,y,x1,y,'wave-axis');text(x0,y-75,label,'svg-label')}path(samples(x=>yA-w1(x)),'wave-one');path(samples(x=>yB-w2(x)),'wave-two');path(samples(x=>yR-w1(x)-w2(x)),'wave-result');dots(x=>yA-w1(x),'particle-one');dots(x=>yB-w2(x),'particle-two');dots(x=>yR-w1(x)-w2(x),'particle-result');line(870,70,970,70,'direction','directionArrow');text(860,75,'Wave 1','wave-note','end');if(state.direction==='left'){line(970,225,870,225,'direction','directionArrow');text(980,230,'Wave 2','wave-note')}else{line(870,225,970,225,'direction','directionArrow');text(860,230,'Wave 2','wave-note','end')}text(550,535,'y = y₁ + y₂','formula','middle')}
function drawString(){const y=290,L=x1-x0,n=state.harmonic,wt=2*Math.PI*state.f*state.t,shape=s=>Math.sin(n*Math.PI*s),wave=(x,s)=>y-state.A1*shape(s)*Math.cos(wt);line(x0,y,x1,y,'wave-axis');path(samples(wave),'wave-result');dots(wave,'particle-result');el('rect',{x:x0-13,y:y-95,width:13,height:190,class:'wall'});el('rect',{x:x1,y:y-95,width:13,height:190,class:'wall'});for(let j=0;j<=n;j++){const x=x0+L*j/n;el('circle',{cx:x,cy:y,r:7,class:'node'});text(x,y+30,'N','svg-label','middle')}for(let j=0;j<n;j++){const x=x0+L*(j+.5)/n;el('circle',{cx:x,cy:y,r:6,class:'antinode'});text(x,y-82,'A','svg-label','middle')}text(550,80,`Mode ${n}: ${n} loop${n===1?'':'s'}`,'formula','middle');text(550,515,'Fixed at both ends','wave-note','middle')}
function pipePositions(){const L=x1-x0,h=state.harmonic;if(state.pipeType==='open'){const nodes=Array.from({length:h},(_,j)=>(j+.5)/h),anti=Array.from({length:h+1},(_,j)=>j/h);return{nodes,anti,order:h,lambda:2*state.pipeLength/h}}const p=2*h-1,nodes=[],anti=[];for(let j=0;2*j/p<=1+1e-8;j++)nodes.push(2*j/p);for(let j=0;(2*j+1)/p<=1+1e-8;j++)anti.push((2*j+1)/p);return{nodes,anti,order:p,lambda:4*state.pipeLength/p}}
function drawPipe(){const top=175,bottom=405,mid=290,L=x1-x0,info=pipePositions(),wt=2*Math.PI*.8*state.t,shape=s=>state.pipeType==='open'?Math.cos(state.harmonic*Math.PI*s):Math.sin(info.order*Math.PI*s/2),wave=(x,s)=>mid-state.A1*shape(s)*Math.cos(wt);el('rect',{x:x0,y:top,width:L,height:bottom-top,class:'pipe'});if(state.pipeType==='open'){el('rect',{x:x0-7,y:top-12,width:14,height:bottom-top+24,fill:'white'});line(x0,top,x0+24,top,'pipe-open');line(x0,bottom,x0+24,bottom,'pipe-open')}else el('rect',{x:x0-15,y:top,width:15,height:bottom-top,class:'wall'});el('rect',{x:x1-7,y:top-12,width:14,height:bottom-top+24,fill:'white'});line(x1-24,top,x1,top,'pipe-open');line(x1-24,bottom,x1,bottom,'pipe-open');line(x0,mid,x1,mid,'wave-axis');path(samples(wave),'wave-result');for(const row of[240,290,340])for(let i=0;i<=24;i++){const s=i/24,rest=x0+L*s,dx=state.A1*.42*shape(s)*Math.cos(wt);el('circle',{cx:rest+dx,cy:row,r:3.5,class:'air-particle'})}for(const s of info.nodes){const x=x0+L*s;el('circle',{cx:x,cy:mid,r:7,class:'node'});text(x,mid+32,'N','svg-label','middle')}for(const s of info.anti){const x=x0+L*s;el('circle',{cx:x,cy:mid,r:6,class:'antinode'});text(x,mid-88,'A','svg-label','middle')}text(550,92,state.pipeType==='open'?`Open pipe: harmonic ${state.harmonic}`:`Closed pipe: harmonic ${info.order}`,'formula','middle');text(550,500,'Air displacement','wave-note','middle')}
function pipeFrequency(lambda){return 340/(lambda/100)}function draw(){svg.innerHTML='';defs();if(state.mode==='superposition')drawSuperposition();if(state.mode==='string')drawString();if(state.mode==='pipe')drawPipe();const phase=(((state.mode==='pipe'?.8:state.f)*state.t)%1+1)%1;$('timePhase').value=phase;$('timeOutput').textContent=`${Math.round(phase*360)}°`;updateReadout()}
function updateReadout(){let lambda=state.lambda,f=state.f,desc='';if(state.mode==='superposition'){desc=`v = ${(state.lambda*state.f).toFixed(0)} cm s⁻¹ • Wave 2 travels ${state.direction}`;$('modeValue').textContent='Superposition'}else if(state.mode==='string'){lambda=240/state.harmonic;desc=`${state.harmonic+1} nodes • ${state.harmonic} antinodes • v = ${(lambda*state.f).toFixed(0)} cm s⁻¹`;$('modeValue').textContent='Standing string'}else{const info=pipePositions();lambda=info.lambda;f=pipeFrequency(lambda);desc=`${info.nodes.length} node${info.nodes.length===1?'':'s'} • ${info.anti.length} antinode${info.anti.length===1?'':'s'} • sound speed 340 m s⁻¹`;$('modeValue').textContent=state.pipeType==='open'?'Open–open pipe':'Closed–open pipe'}$('lambdaValue').textContent=`${lambda.toFixed(1).replace('.0','')} cm`;$('freqValue').textContent=`${f.toFixed(2)} Hz`;$('description').textContent=desc}
function sync(){const pipe=state.mode==='pipe',superMode=state.mode==='superposition',harmonic=state.mode!=='superposition';$('amplitude2Field').hidden=!superMode;$('wavelengthField').hidden=!superMode;$('phaseField').hidden=!superMode;$('directionField').hidden=!superMode;$('frequencyField').hidden=pipe;$('harmonicField').hidden=!harmonic;$('pipeLengthField').hidden=!pipe;$('pipeTypeField').hidden=!pipe;$('amplitude1').value=state.A1;$('amplitude2').value=state.A2;$('wavelength').value=state.lambda;$('frequency').value=state.f;$('phaseDifference').value=state.phase;$('harmonic').value=state.harmonic;$('pipeLength').value=state.pipeLength;$('amplitude1Output').textContent=`${state.A1} cm`;$('amplitude2Output').textContent=`${state.A2} cm`;$('wavelengthOutput').textContent=`${state.lambda} cm`;$('frequencyOutput').textContent=`${state.f.toFixed(2)} Hz`;$('phaseOutput').textContent=`${state.phase}°`;$('harmonicOutput').textContent=state.pipeType==='closed'?`${2*state.harmonic-1}`:`${state.harmonic}`;$('pipeLengthOutput').textContent=`${state.pipeLength} cm`;document.querySelectorAll('#modeControl button').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));document.querySelectorAll('#directionControl button').forEach(b=>b.classList.toggle('active',b.dataset.value===state.direction));document.querySelectorAll('#pipeTypeControl button').forEach(b=>b.classList.toggle('active',b.dataset.value===state.pipeType));$('playPause').textContent=state.running?'Pause':'Play';draw()}
const map={amplitude1:'A1',amplitude2:'A2',wavelength:'lambda',frequency:'f',phaseDifference:'phase',harmonic:'harmonic',pipeLength:'pipeLength'};Object.keys(map).forEach(id=>$(id).addEventListener('input',e=>{state[map[id]]=+e.target.value;sync()}));$('modeControl').addEventListener('click',e=>{if(!e.target.dataset.mode)return;state.mode=e.target.dataset.mode;state.t=0;sync()});$('directionControl').addEventListener('click',e=>{if(!e.target.dataset.value)return;state.direction=e.target.dataset.value;sync()});$('pipeTypeControl').addEventListener('click',e=>{if(!e.target.dataset.value)return;state.pipeType=e.target.dataset.value;state.t=0;sync()});$('playPause').addEventListener('click',()=>{state.running=!state.running;last=0;sync()});$('timePhase').addEventListener('input',e=>{state.running=false;const f=state.mode==='pipe'?.8:state.f;state.t=+e.target.value/f;sync()});$('reset').addEventListener('click',()=>{Object.assign(state,{mode:'superposition',A1:42,A2:42,lambda:180,f:1,phase:0,direction:'left',harmonic:2,pipeLength:120,pipeType:'open',t:0,running:true});last=0;sync()});function sy(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse()).y}svg.addEventListener('pointerdown',e=>{const y=sy(e);dragging=state.mode==='superposition'?(y<215?'A1':y<370?'A2':'A1'):'A1';svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!dragging)return;const y=sy(e),base=state.mode==='superposition'?(dragging==='A1'?135:290):290;state[dragging]=Math.max(10,Math.min(60,Math.abs(y-base)));sync()});svg.addEventListener('pointerup',()=>dragging='');svg.addEventListener('pointercancel',()=>dragging='');function frame(ts){if(state.running){if(last)state.t+=Math.min(.05,(ts-last)/1000);draw()}last=ts;requestAnimationFrame(frame)}sync();requestAnimationFrame(frame);
</script></body></html>
